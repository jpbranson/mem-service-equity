name: poll-mata

# Phase 1 collection (plan 6.1). Each run polls for 170 minutes and runs
# start every 2 hours, so consecutive runs overlap by 50 minutes and absorb
# cron delays up to that. Runs start at 7 past the hour because GitHub delays,
# and can drop, scheduled runs at the busy top of the hour.
# Overlap produces duplicate reports, removed downstream on
# (vehicle, timestamp). Every poll attempt is logged, so real gaps are
# measurable.

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to poll"
        default: "170"

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r pollers/requirements.txt
      - name: Pin the archive week for this run
        run: echo "ARCHIVE_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
      # Uploads every 30 minutes while polling, so a lost runner costs at most
      # 30 minutes of data; the step below uploads the rest at the end.
      - name: Poll, archiving every 30 minutes
        working-directory: pollers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash poll_with_uploads.sh mata ../data/poller/mata 1800
          python mata_poller.py --minutes "${{ github.event.inputs.minutes || '170' }}" --out ../data/poller
      - name: Archive to weekly release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pollers/archive_release.sh mata data/poller/mata
