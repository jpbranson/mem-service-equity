name: test-memequity

on:
  push:
    paths: ["packages/memequity/**", "specs/**", "geography/**", "pipelines/311/**", "pipelines/permits/**",
            "pipelines/food-safety/**", "pipelines/mata/**",
            ".github/workflows/test-memequity.yml"]
  pull_request:
    paths: ["packages/memequity/**", "specs/**", "geography/**", "pipelines/311/**", "pipelines/permits/**",
            "pipelines/food-safety/**", "pipelines/mata/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/memequity
          extra-packages: any::devtools, any::rcmdcheck, any::data.table, local::.
      - name: Run tests
        working-directory: packages/memequity
        run: Rscript -e 'res <- devtools::test(stop_on_failure = TRUE)'
      - name: Run 311 pipeline tests
        run: Rscript -e 'testthat::test_dir("pipelines/311/tests/testthat", stop_on_failure = TRUE)'
      - name: Run permits pipeline tests
        run: Rscript -e 'testthat::test_dir("pipelines/permits/tests/testthat", stop_on_failure = TRUE)'
      - name: Run food-safety pipeline tests
        run: Rscript -e 'testthat::test_dir("pipelines/food-safety/tests/testthat", stop_on_failure = TRUE)'
      - name: Run MATA pipeline tests
        run: Rscript -e 'testthat::test_dir("pipelines/mata/tests/testthat", stop_on_failure = TRUE)'
