name: test-memequity

on:
  push:
    paths: ["packages/memequity/**", "specs/**", ".github/workflows/test-memequity.yml"]
  pull_request:
    paths: ["packages/memequity/**", "specs/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/memequity
          extra-packages: any::devtools, any::rcmdcheck
      - name: Run tests
        working-directory: packages/memequity
        run: Rscript -e 'res <- devtools::test(stop_on_failure = TRUE)'
