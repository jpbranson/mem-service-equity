name: test-memequity

on:
  push:
    paths: ["packages/memequity/**", "specs/**", "geography/**", "pipelines/311/**", ".github/workflows/test-memequity.yml"]
  pull_request:
    paths: ["packages/memequity/**", "specs/**", "geography/**", "pipelines/311/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/memequity
          extra-packages: any::devtools, any::rcmdcheck, any::data.table, local::.
      - name: Run tests
        working-directory: packages/memequity
        run: Rscript -e 'res <- devtools::test(stop_on_failure = TRUE)'
      - name: Run 311 pipeline tests
        run: Rscript -e 'testthat::test_dir("pipelines/311/tests/testthat", stop_on_failure = TRUE)'
