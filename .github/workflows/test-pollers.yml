name: test-pollers

on:
  push:
    paths: ["pollers/**", ".github/workflows/test-pollers.yml"]
  pull_request:
    paths: ["pollers/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r pollers/requirements.txt
      - run: python -m pytest pollers/tests -q
