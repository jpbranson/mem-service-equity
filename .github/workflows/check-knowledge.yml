name: check-knowledge

# Checks the knowledge bundle (knowledge/) against Open Knowledge Format v0.2
# and the conventions in CLAUDE.md. Runs on every push, not only when
# knowledge/ changes, because concepts cite repo files: moving or deleting a
# cited file fails the check until the concept that cites it is updated.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install yaml
        run: Rscript -e 'install.packages("yaml")'
      - name: Check the knowledge bundle
        run: Rscript .github/scripts/check_knowledge.R knowledge
